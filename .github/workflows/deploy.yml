# 把 VitePress 站点自动部署到 GitHub Pages 的工作流。
# 触发条件：main 分支有新推送，或在 Actions 页面手动触发（workflow_dispatch）。
name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Page 部署需要的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署在跑，旧的排队的取消掉
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（拉取代码）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉全量历史，供「最后更新时间」等功能使用

      - name: Setup Node（装 Node 22）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages（启用 Pages）
        uses: actions/configure-pages@v5

      - name: Install dependencies（装依赖）
        run: npm ci

      - name: Build with VitePress（构建站点）
        run: npm run docs:build

      - name: Upload artifact（上传构建产物）
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages（发布到 Pages）
        id: deployment
        uses: actions/deploy-pages@v4
